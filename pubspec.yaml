name: dawaei
description: Offline-first medication organizer for Arabic and English speakers.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.7.2
  flutter: '>=3.29.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  logger: ^2.8.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  flutter_local_notifications: 19.5.0
  flutter_timezone: 5.1.1
  timezone: 0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/onboarding/
    - assets/brand/
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
